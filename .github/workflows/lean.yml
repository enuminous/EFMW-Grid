name: Lean formalization
on:
  push:
    paths:
      - 'EFMWGrid.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'EFMWGrid.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - name: Reject dependency or toolchain drift
        run: git diff --exit-code -- lakefile.toml lake-manifest.json lean-toolchain
